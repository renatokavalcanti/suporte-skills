# ---------------------------------------------------------------------------
# Suporte Skills - Web (SPA React) no ambiente de NUVEM (Azure) - D-037.
#
# Aqui o nginx serve a SPA e faz o proxy da API em **HTTP puro**: o TLS e' feito
# pelo Caddy (Let's Encrypt) que fica a frente (ver docker-compose.cloud.yml).
# O on-prem continua usando frontend/nginx.conf (HTTPS com cert autoassinado).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy para a API NestJS (servico "api" da rede do compose).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O TLS termina no Caddy (a frente), entao o cliente fala https.
        proxy_set_header X-Forwarded-Proto https;
        # Sincronizacao do Zoho pode levar minutos (D-034).
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # SPA fallback: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
