name: suporte-skills

services:
  db:
    image: postgres:16-alpine
    container_name: suporte-skills-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suporte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suporte}
      POSTGRES_DB: ${POSTGRES_DB:-suporte_skills}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-suporte} -d ${POSTGRES_DB:-suporte_skills}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    container_name: suporte-skills-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # Ambiente (PRD/HML/DEV) exibido na interface (D-038).
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-DEV}
      DATABASE_URL: postgresql://${POSTGRES_USER:-suporte}:${POSTGRES_PASSWORD:-suporte}@db:5432/${POSTGRES_DB:-suporte_skills}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-troque-este-segredo-de-acesso-com-no-minimo-32-caracteres}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque-este-segredo-de-refresh-com-no-minimo-32-caracteres}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      CERT_EXPIRING_DAYS: ${CERT_EXPIRING_DAYS:-90}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      NEWS_SYNC_ENABLED: ${NEWS_SYNC_ENABLED:-false}
      NEWS_SYNC_INTERVAL_MINUTES: ${NEWS_SYNC_INTERVAL_MINUTES:-360}
      NEWS_FETCH_TIMEOUT_MS: ${NEWS_FETCH_TIMEOUT_MS:-10000}
      NEWS_MAX_ITEMS_PER_SOURCE: ${NEWS_MAX_ITEMS_PER_SOURCE:-30}
      NEWS_DIGEST_ENABLED: ${NEWS_DIGEST_ENABLED:-false}
      NEWS_DIGEST_WINDOW_DAYS: ${NEWS_DIGEST_WINDOW_DAYS:-7}
      NEWS_DIGEST_MAX_ITEMS: ${NEWS_DIGEST_MAX_ITEMS:-20}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      UPLOADS_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # Modulo Tickets/Chamados (D-029/D-030) - opt-in.
      TICKETS_ENABLED: ${TICKETS_ENABLED:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://localhost}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://localhost}
      # Espelhamento do Zoho Desk (somente leitura; opt-in). Credenciais sao
      # fallback - a tela de Configuracoes (cifrada) tem prioridade.
      ZOHO_SYNC_ENABLED: ${ZOHO_SYNC_ENABLED:-false}
      ZOHO_SYNC_INTERVAL_MINUTES: ${ZOHO_SYNC_INTERVAL_MINUTES:-360}
      ZOHO_FETCH_TIMEOUT_MS: ${ZOHO_FETCH_TIMEOUT_MS:-15000}
      ZOHO_MAX_TICKETS_PER_RUN: ${ZOHO_MAX_TICKETS_PER_RUN:-1000}
      ZOHO_API_BASE_URL: ${ZOHO_API_BASE_URL:-}
      ZOHO_ACCOUNTS_BASE_URL: ${ZOHO_ACCOUNTS_BASE_URL:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_ORG_ID: ${ZOHO_ORG_ID:-}
      # Envio de e-mail (D-030): config na tela; overrides do Graph so' p/ teste.
      EMAIL_GRAPH_LOGIN_BASE_URL: ${EMAIL_GRAPH_LOGIN_BASE_URL:-https://login.microsoftonline.com}
      EMAIL_GRAPH_BASE_URL: ${EMAIL_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      # Anexos (D-025) em pasta persistente do host (fora do web root).
      - ./data/uploads:/app/uploads

  # Seed DEMO sob demanda: docker compose --profile tools run --rm seed
  seed:
    build:
      context: ./backend
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-suporte}:${POSTGRES_PASSWORD:-suporte}@db:5432/${POSTGRES_DB:-suporte_skills}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@suporte.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    command: sh -c "npx prisma migrate deploy && npm run seed"

  web:
    build:
      context: ./frontend
      args:
        # Modulo Tickets (D-029): ligar a SPA so' no release (VITE_TICKETS_ENABLED=true).
        VITE_TICKETS_ENABLED: ${VITE_TICKETS_ENABLED:-false}
        # Ambiente (PRD/HML/DEV) exibido na interface (D-038).
        VITE_APP_ENVIRONMENT: ${APP_ENVIRONMENT:-DEV}
    container_name: suporte-skills-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
      - '${WEB_TLS_PORT:-443}:443'
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  dbdata:
